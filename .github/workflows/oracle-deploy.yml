name: Oracle deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: randevu-oracle-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Release on Oracle over SSH
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$scratch/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$scratch/known_hosts"
          ssh -i "$scratch/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            randevu-deploy@130.61.82.184 "$RELEASE_SHA"
      - name: Verify public health
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --max-time 15 https://randevu-platformu.selman-cinn.workers.dev/api/health |
            jq -e --arg revision "$RELEASE_SHA" '.status == "ready" and .revision == $revision'
