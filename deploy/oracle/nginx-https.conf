limit_req_zone $binary_remote_addr zone=randevu_requests:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=randevu_auth:10m rate=24r/m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name randevu.130-61-82-184.sslip.io;
    ssl_certificate /etc/letsencrypt/live/randevu.130-61-82-184.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/randevu.130-61-82-184.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 1m;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    location ~ ^/(hesap|panel)$ {
        limit_req zone=randevu_auth burst=16 nodelay;
        proxy_pass http://127.0.0.1:4312;
    }
    location / {
        limit_req zone=randevu_requests burst=45 nodelay;
        proxy_pass http://127.0.0.1:4312;
    }
}
