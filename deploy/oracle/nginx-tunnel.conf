server {
    listen 127.0.0.1:4313;
    server_name randevu-platformu.selman-cinn.workers.dev;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    access_log off;
    client_max_body_size 1m;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    location ~ ^/(hesap|panel)$ {
        limit_req zone=randevu_auth burst=16 nodelay;
        proxy_pass http://127.0.0.1:4312;
    }
    location / {
        limit_req zone=randevu_requests burst=45 nodelay;
        proxy_pass http://127.0.0.1:4312;
    }
}
